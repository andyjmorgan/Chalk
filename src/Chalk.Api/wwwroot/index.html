<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chalk</title>
<meta name="description" content="Short-lived records for agents. Review what they wrote; remove what is wrong.">
<link rel="icon" type="image/svg+xml" href="brand/am-ai-sage-dark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
<script>try{var t=localStorage.getItem('chalk.theme');document.documentElement.dataset.theme=t?JSON.parse(t):'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
</head>
<body>
<div id="shell" class="shell">
  <button id="scrim" class="scrim hidden" aria-label="Close navigation" type="button"></button>
  <aside id="side" class="side">
    <div class="sidehead">
      <a class="logo" href="#/"><img class="light" src="brand/am-ai-sage-light.svg" alt=""><img class="dark" src="brand/am-ai-sage-dark.svg" alt=""><span class="logotext">Chalk</span></a>
      <button id="closeNav" class="icon mobile" aria-label="Close navigation" type="button"></button>
    </div>
    <nav id="nav" class="nav" aria-label="Main"></nav>
    <div class="sidefoot">
      <span class="tag">Build something rad</span>
      <button id="collapse" class="icon desktop" aria-label="Collapse navigation" type="button"></button>
    </div>
  </aside>
  <div class="body">
    <header class="top">
      <button id="openNav" class="icon mobile" aria-label="Open navigation" type="button"></button>
      <div class="spacer"></div>
      <button id="theme" class="icon" aria-label="Toggle theme" type="button"></button>
      <div id="user" class="user"></div>
    </header>
    <main id="app" class="app"></main>
  </div>
</div>
<div id="login" class="login hidden">
  <main class="auth">
    <img class="logo light" src="brand/am-ai-sage-light.svg" alt="Chalk"><img class="logo dark" src="brand/am-ai-sage-dark.svg" alt="Chalk">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to review your boards</p>
    <div id="idps" class="idps" aria-label="Sign in"></div>
    <p id="loginErr" class="err" role="alert"></p>
    <button id="pwLogin" class="ghost" type="button">Sign in with a username and password</button>
    <details id="keyLogin">
      <summary>Use an API key instead</summary>
      <form id="loginForm">
        <input id="apiKey" class="mono" type="password" placeholder="chk_…" autocomplete="off" required aria-label="API key">
        <button type="submit" class="primary">Open</button>
      </form>
    </details>
  </main>
  <footer>Built with questionable decisions and caffeine</footer>
</div>
<script src="app.js"></script>
</body>
</html>
